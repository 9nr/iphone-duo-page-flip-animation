<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="src/style.css">

<div class="wrap">
  <canvas id="stage"></canvas>
</div>

<div class="dock">
  <div class="bar">
    <button class="pri" id="flip">اقلب الصفحة</button>
    <label class="file">حمّل تصاميمك<input type="file" id="pick" accept="image/*" multiple></label>
    <select id="size"></select>
    <button id="reset">صفّر</button>
  </div>

  <div class="bar">
    <span style="font-size:11.5px;color:#818974">الخلفية</span>
    <select id="bgmode">
      <option value="solid">لون</option>
      <option value="image">صورة</option>
    </select>
    <input type="color" id="bgcol" value="#f6f6f3">
    <label class="file">صورة الخلفية<input type="file" id="bgpick" accept="image/*"></label>
  </div>

  <div id="scrubWrap">
    <span style="font-size:11.5px;color:#818974;white-space:nowrap">يدوي</span>
    <input type="range" id="scrub" min="0" max="1000" value="0">
  </div>

  <div class="sliders">
    <div class="sl">المدة <input type="range" id="dur" min="400" max="3000" step="50" value="3000"><b id="durV">3000ms</b></div>
    <div class="sl">أقصى بلور <input type="range" id="blur" min="0" max="160" step="2" value="150"><b id="blurV">150px</b></div>
    <div class="sl">العدسة <input type="range" id="eye" min="200" max="2000" step="20" value="560"><b id="eyeV">560</b></div>
    <div class="sl">التعتيم <input type="range" id="dark" min="0" max="300" step="5" value="250"><b id="darkV">250%</b></div>
    <div class="sl">منظور <input type="range" id="stick" min="0" max="100" step="5" value="0"><b id="stickV">0%</b></div>
    <div class="sl">إضاءة <input type="range" id="light" min="0" max="100" step="5" value="0"><b id="lightV">0%</b></div>
    <div class="sl">سماكة <input type="range" id="thick" min="0" max="60" step="1" value="10"><b id="thickV">10</b></div>
    <div class="sl">حجم <input type="range" id="fit" min="30" max="95" step="1" value="62"><b id="fitV">62%</b></div>
    <div class="sl">تدوير الزوايا <input type="range" id="rad" min="0" max="80" step="1" value="40"><b id="radV">40</b></div>
    <div class="sl">ظل المحور <input type="range" id="crease" min="0" max="100" step="5" value="0"><b id="creaseV">0%</b></div>
  </div>
</div>

<div class="warn" id="warn" hidden></div>

<div class="meta">
  <span class="tag">الزاوية <b id="mA">0°</b></span>
  <span class="tag">التقدّم <b id="mP">0%</b></span>
  <span class="tag">الوجه <b id="mF">أمامي</b></span>
  <span class="tag">التصميم <b id="mI">1 / 3</b></span>
  <span class="tag">المسرح <b id="mS">2.40:1</b></span>
</div>

<!-- classic scripts, in dependency order, deliberately: ES modules do not load
     from file:// and this page has to open by double-click as well as through
     the renderer. No build step, no bundler. -->
<script src="src/constants.js"></script>
<script src="src/assets.js"></script>
<script src="src/shaders.js"></script>
<script src="src/gl.js"></script>
<script src="src/textures.js"></script>
<script src="src/stage.js"></script>
<script src="src/engine.js"></script>
<script src="src/controls.js"></script>
<script src="src/render-api.js"></script>
<script>
/* boot: placeholders first so the stage is never empty, then the real artwork
   if this origin allows it - see loadAssets() */
buildPlaceholders();
resize();
loadAssets();
</script>
